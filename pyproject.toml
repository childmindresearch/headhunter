[project]
name = "headhunter"
version = "0.1.0"
description = "A parser for extracting the headings from Markdown files"
authors = [
  {name = "CMI DAIR", email = "dair@childmind.org"},
  {name = "Alp Erkent", email = "alp.erkent@childmind.org"}
]
license = "LGPL-2.1-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.3.3",
  "rapidfuzz>=3.14.3",
  "tqdm>=4.67.1"
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "mypy>=1.20.2",
  "pre-commit>=4.6.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
  "deptry>=0.25.1"
]
docs = ["pdoc>=16.0.0"]
notebooks = [
  "jupyter>=1.1.1",
  "ipykernel>=7.2.0",
  "pyarrow>=24.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
